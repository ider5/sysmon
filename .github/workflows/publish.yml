name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest -v

      - name: Build package
        run: python -m build

      - name: Assert sdist and wheel exist
        run: |
          set -euo pipefail
          ls -la dist/
          test -n "$(find dist -maxdepth 1 -name '*.whl')"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz')"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # OIDC trusted publishing is preferred; password is used when the secret exists.
          password: ${{ secrets.PYPI_API_TOKEN }}
