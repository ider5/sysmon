[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmon"
version = "0.4.0"
description = "A beautiful system monitoring CLI tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SysMon Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
sysmon = "sysmon.cli:app"

[project.urls]
Homepage = "https://github.com/ider5/sysmon"
Repository = "https://github.com/ider5/sysmon"
Changelog = "https://github.com/ider5/sysmon/blob/master/CHANGELOG.md"

[project.optional-dependencies]
gpu = [
    "GPUtil>=1.4.0",
    "nvidia-ml-py>=12.0.0",
]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0",
    "ruff>=0.4",
    "shtab>=1.7",
]

[tool.setuptools.packages.find]
include = ["sysmon*"]

[tool.maturin]
module-name = "sysmon._core"
manifest-path = "native/sysmon-core/Cargo.toml"
python-source = "."


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
